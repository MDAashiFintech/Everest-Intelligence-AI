[variables]
    PYTHON_VERSION = '3.11'

[phases.setup]
    nixPkgs = ['python311']

[phases.install]
    cmds = [
        'pip install --upgrade pip',
        'pip install -r requirements.txt',
        'python nltk_data_download.py'
    ]

[start]
    cmd = 'gunicorn --chdir web app:app --timeout 120'